name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release in flight

jobs:
  build:
    name: build / verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack source tarball (sanity)
        run: pnpm pack --pack-destination /tmp/dsh-tarball

      - name: Verify version matches tag
        run: |
          TARBALL=$(ls /tmp/dsh-tarball/*.tgz | head -1)
          echo "Tarball: $TARBALL"
          mkdir -p /tmp/dsh-extract
          tar -xzf "$TARBALL" -C /tmp/dsh-extract
          PKG_VERSION=$(node -e "console.log(require('/tmp/dsh-extract/package/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: /tmp/dsh-tarball/*.tgz
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: /tmp/dsh-tarball

      - name: Generate changelog excerpt
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # extract the section for the current tag from CHANGELOG.md
          SECTION=$(awk "/^## \\[${TAG#v}\\]/{flag=1; next} /^## \\[/ && flag{exit} flag" CHANGELOG.md)
          {
            echo "section<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.section }}

            **Full Changelog**: https://github.com/eastspire/dsh-plugin-longmem/compare/${{ github.ref_name }}...master
          files: |
            /tmp/dsh-tarball/*.tgz
          fail_on_unmatched_files: true
